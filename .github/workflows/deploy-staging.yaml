name: Deploy HelloTrekkers Staging
on:
  push:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Create .env file
        run: |
          touch .env
          echo "VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}" >> .env
          echo "VITE_BASE_MEDIA_URL=${{ secrets.VITE_BASE_MEDIA_URL }}" >> .env
          echo "VITE_CLOUDINARY_BASE_MEDIA_URL=${{ secrets.VITE_CLOUDINARY_BASE_MEDIA_URL }}" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy via Rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Test SSH connection
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }} exit

          # Rsync with key specified
          rsync -avz --delete  \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            dist/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }}:/home/hellotre/staging.hellotrekkers.com/